name: Backend quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-flow:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and test tools
        run: python -m pip install -e '.[dev]'
      - name: Unit and API flow tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: demo_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo_test -d demo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: 'postgresql+asyncpg://demo_test:test_only_password@localhost:5432/demo_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application
        run: python -m pip install -e '.[dev]'
      - name: Verify schema migration
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
